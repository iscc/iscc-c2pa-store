[project]
name = "iscc-c2pa-store"
version = "0.1.1"
description = "C2PA Manifest Repository with a Soft Binding Resolution API that declares ISCC soft bindings on the ISCC Discovery Protocol"
authors = [{ name = "Titusz Pan", email = "tp@py7.de" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Private :: Do Not Upload",
]
dependencies = [
    "c2pa-python>=0.38.0,<0.39",
    "django>=6.1.2,<6.2",
    "dj-database-url>=3.1",
    "django-ninja>=1.7.1,<2",
    "django-unfold>=0.108",
    "gunicorn>=26.2",
    "httpx2>=2.13.1,<3",
    "iscc-core>=1.4.0",
    "iscc-crypto>=0.5.0",
    "numpy>=2.3",
    "servestatic>=4.4",
]

[project.urls]
Homepage = "https://iscc.io"
Repository = "https://github.com/iscc/iscc-c2pa-store"

[dependency-groups]
dev = [
    "cryptography>=46",
    "datamodel-code-generator>=0.83",
    "django-types>=0.24",
    "hypothesis>=6.160",
    "mdformat>=1.0.0",
    "mdformat-mkdocs[recommended]>=5.1",
    "openapi-spec-validator>=0.9",
    "pillow>=12",
    "poethepoet>=0.48",
    "prek>=0.5",
    "pyright>=1.1.400",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-django>=4.14",
    "pyyaml>=6.0.3",
    "ruff>=0.16",
    "schemathesis>=4.29",
]
docs = [
    "zensical-iscc",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iscc_c2pa_store"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["iscc_c2pa_store/migrations"] # written by makemigrations

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe complexity
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "DJ",  # flake8-django
    "RUF", # ruff-specific
]

# Imports used only in PEP 484 type comments look unused to ruff: never remove them automatically.
unfixable = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works
"iscc_c2pa_store/schema/**" = ["E501"] # generated from the OpenAPI descriptions

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["iscc_c2pa_store"]
exclude = ["iscc_c2pa_store/migrations", "iscc_c2pa_store/schema"]  # generated by makemigrations, datamodel-codegen

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["iscc_c2pa_store"]
omit = ["iscc_c2pa_store/migrations/*", "iscc_c2pa_store/wsgi.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
skip_empty = true

[tool.datamodel-codegen]
input = "iscc_c2pa_store/openapi/openapi.yaml"
input-file-type = "openapi"
output = "iscc_c2pa_store/schema"
output-model-type = "pydantic_v2.BaseModel"
disable-timestamp = true
target-python-version = "3.12"
use-standard-collections = true
use-union-operator = true
use-annotated = true
field-constraints = true
collapse-root-models = true
use-subclass-enum = true
formatters = ["ruff-format"]

[tool.poe.tasks]
sync-c2pa = { cmd = "python scripts/sync_c2pa_openapi.py", help = "Copy the implemented subset of the C2PA OpenAPI from a specs-core checkout" }
vendor-c2pa = { cmd = "python scripts/vendor_c2pa.py", help = "Refresh the vendored C2PA Soft Binding Algorithm List and trust list" }
codegen = { sequence = [{ cmd = "python scripts/openapi_json.py" }, { cmd = "datamodel-codegen" }, { cmd = "ruff check --fix --quiet iscc_c2pa_store/schema" }, { cmd = "ruff format --quiet iscc_c2pa_store/schema" }], help = "Generate openapi.json and pydantic models from openapi.yaml" }
format = { sequence = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }, { cmd = "mdformat README.md CLAUDE.md SECURITY.md docs" }], help = "Format and autofix code and docs" }
lint = { sequence = [{ cmd = "ruff format --check ." }, { cmd = "ruff check ." }, { cmd = "mdformat --check README.md CLAUDE.md SECURITY.md docs" }, { cmd = "python manage.py makemigrations --check --dry-run --settings tests.settings" }], help = "Check formatting, lint rules and missing migrations" }
typecheck = { cmd = "pyright", help = "Static type check" }
test = { cmd = "pytest --cov --cov-report=term-missing --cov-report=xml", help = "Run tests with 100% branch coverage gate" }
audit = { cmd = "uv audit --frozen", help = "Check locked dependencies for known vulnerabilities" }
migrate = { cmd = "python manage.py migrate", envfile = ".env", help = "Apply database migrations to the local dev database" }
serve = { cmd = "python manage.py runserver 127.0.0.1:45470", envfile = ".env", help = "Run a local dev server on port 45470 (settings from .env)" }
conformance = { cmd = "bash scripts/conformance.sh ${base_url}", args = [{ name = "base_url", default = "http://127.0.0.1:45470/v1" }], help = "Run the C2PA conformance harness against a running server" }
docs-serve = { cmd = "zensical serve --dev-addr 127.0.0.1:45471", help = "Preview the documentation site on port 45471" }
docs-build = { cmd = "zensical-iscc build", help = "Build the documentation site into site/" }
docs-check = { cmd = "zensical-iscc check --strict", help = "Check the built documentation site against the ISCC theme rules" }
all = { sequence = ["format", "typecheck", "test"], help = "Format, type check and test (local dev loop)" }
ci = { sequence = ["lint", "typecheck", "test", "audit"], help = "Lint, type check, test and audit without modifying files (CI also runs the prek hooks)" }

[tool.uv.sources]
zensical-iscc = { git = "https://github.com/iscc/zensical-iscc", tag = "v0.2.0" }

[tool.uv]
default-groups = ["dev", "docs"]
