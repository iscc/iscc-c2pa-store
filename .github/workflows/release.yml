name: Release

# A published GitHub Release vX.Y.Z promotes the image that CI built and tested for the release commit on main.
# Nothing is rebuilt, so production runs exactly the bytes that testnet ran.
on:
  release:
    types: [published]

permissions: {}

jobs:
  promote:
    name: Tag image as release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match pyproject version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Retag tested image
        run: |
          source="$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools inspect "$source" > /dev/null
          tags=(-t "$IMAGE:$VERSION")
          if [ "$PRERELEASE" != "true" ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$source"
