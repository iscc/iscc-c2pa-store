# Git hooks, run by prek (https://github.com/j178/prek): `uv run prek install` once, then on every commit.
# `uv run prek run --all-files` checks the whole tree. CI runs the same hooks.
# Vendored and copied files stay byte-identical to their sources (C2PA data, brand kit, generated migrations).
exclude: ^iscc_c2pa_store/(vendor|static/brand|static/vendor)/|^iscc_c2pa_store/openapi/c2pa-sbr\.json$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^uv\.lock$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        files: ^(README|CLAUDE|SECURITY)\.md$|^docs/.*\.md$
        additional_dependencies:
          - "mdformat-mkdocs[recommended]>=5.1"

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/python-openapi/openapi-spec-validator
    rev: 0.9.0
    hooks:
      - id: openapi-spec-validator
        files: ^iscc_c2pa_store/openapi/openapi\.(yaml|json)$

  - repo: local
    hooks:
      - id: codegen
        name: openapi.json and models generated from openapi.yaml are current
        entry: uv run poe codegen
        language: system
        files: ^iscc_c2pa_store/(openapi|schema)/
        pass_filenames: false
      - id: migrations
        name: migrations match the models
        entry: uv run python manage.py makemigrations --check --dry-run --settings tests.settings
        language: system
        files: ^iscc_c2pa_store/(models\.py|migrations/)
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
